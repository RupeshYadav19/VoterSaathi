[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install && npm run build"

[dev]
  port = 8888
  publish = "public"
  functions = "netlify/functions"

# Set aggressive caching for static assets
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Basic security headers for HTML pages
[[headers]]
  for = "/*.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Basic CSP, allowing inline scripts and Firebase domains
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://translate.google.com https://translate.googleapis.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com wss://*.firebaseio.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://translate.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src 'self' https://maps.google.com https://translate.google.com;"

# Handle SPA routing (redirect all unmatched to index.html if it was a React/Vue app, 
# but since this is multi-page, we just redirect 404s to 404.html)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
