<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View your VoterSaathi activity history">
    <title>My Profile | VoterSaathi</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&family=Caveat:wght@700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <!-- Inline script for private config loading -->
    <script>
        window.VOTER_CONFIG = { FIREBASE_CONFIG: { apiKey: "AIzaSyBsig8D6YYHxj47VZHVpUWER6HEbCt70qU", authDomain: "votersaathi-4f677.firebaseapp.com", projectId: "votersaathi-4f677", storageBucket: "votersaathi-4f677.firebasestorage.app", messagingSenderId: "573822959238", appId: "1:573822959238:web:2d75f9c5b8f57e37b31b07", measurementId: "G-898FTMFDB0" } };
    </script>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to Main Content</a>
    
    <header class="navbar" role="banner">
        <div class="container nav-container">
            <a href="index.html" class="nav-logo" aria-label="VoterSaathi Home">
                <img src="https://cdn-icons-png.flaticon.com/512/3593/3593463.png" alt="" width="28">
                VoterSaathi
            </a>
            <nav class="nav-links" id="navLinks" role="navigation" aria-label="Main Navigation">
                <a href="index.html">Dashboard</a>
                <a href="profile.html" class="active" aria-current="page">My Profile</a>
            </nav>
            <div class="nav-right">
                <div class="hamburger" id="hamburgerMenu" role="button" tabindex="0" aria-label="Open Mobile Menu" aria-expanded="false">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>
    </header>

    <main id="main-content" class="container" style="padding: 40px 24px;">
        <h1 style="margin-bottom: 24px;">My Profile</h1>
        
        <div id="authRequired" style="display:none;" class="clay-card red">
            <h2>Authentication Required</h2>
            <p>Please log in to view your profile and activity history.</p>
        </div>

        <div id="profileContent" style="display:none;">
            <div class="clay-card blue" style="margin-bottom: 32px;">
                <h2 id="userName">Loading...</h2>
                <p id="userEmail" class="text-muted"></p>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                <div class="clay-card yellow">
                    <h3>Recent Searches</h3>
                    <ul id="searchHistory" style="list-style: none; padding: 0; margin-top: 16px;">
                        <li>Loading...</li>
                    </ul>
                </div>
                <div class="clay-card pink">
                    <h3>AI Chat History</h3>
                    <div id="chatHistory" style="margin-top: 16px; max-height: 300px; overflow-y: auto;">
                        <p>Loading...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- App Logic -->
    <script type="module" src="js/ui.js"></script>
    <script type="module">
        import { initUI, showToast, toggleContainerLoading } from './js/ui.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
        
        document.addEventListener('DOMContentLoaded', () => {
            initUI();
            
            const app = initializeApp(window.VOTER_CONFIG.FIREBASE_CONFIG);
            const auth = getAuth(app);
            const db = getFirestore(app);

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    document.getElementById('authRequired').style.display = 'none';
                    document.getElementById('profileContent').style.display = 'block';
                    document.getElementById('userName').textContent = user.displayName || 'Voter';
                    document.getElementById('userEmail').textContent = user.email;

                    // Fetch Search History
                    try {
                        const userDoc = await getDoc(doc(db, "users", user.uid));
                        if (userDoc.exists()) {
                            const data = userDoc.data();
                            if (data.lastPincode) {
                                document.getElementById('searchHistory').innerHTML = `
                                    <li style="padding: 12px; border-bottom: 1px solid rgba(0,0,0,0.1);">
                                        <strong>Pincode:</strong> ${data.lastPincode}
                                    </li>`;
                            } else {
                                document.getElementById('searchHistory').innerHTML = '<li>No recent searches</li>';
                            }
                        }
                    } catch (e) {
                        document.getElementById('searchHistory').innerHTML = '<li>Error loading searches</li>';
                    }

                    // Fetch Chat History
                    try {
                        const q = query(collection(db, "chatHistory"), where("userId", "==", user.uid), orderBy("timestamp", "desc"), limit(5));
                        const querySnapshot = await getDocs(q);
                        let chatHTML = '';
                        querySnapshot.forEach((doc) => {
                            const d = doc.data();
                            chatHTML += `
                                <div style="margin-bottom: 16px; padding: 12px; background: rgba(255,255,255,0.5); border-radius: 8px;">
                                    <p><strong>You:</strong> ${d.userMessage}</p>
                                    <p><strong>AI:</strong> ${d.aiResponse}</p>
                                </div>
                            `;
                        });
                        document.getElementById('chatHistory').innerHTML = chatHTML || '<p>No chat history</p>';
                    } catch (e) {
                        console.error(e);
                        document.getElementById('chatHistory').innerHTML = '<p>Error loading chats. (Requires Firebase Indexes)</p>';
                    }
                } else {
                    document.getElementById('authRequired').style.display = 'block';
                    document.getElementById('profileContent').style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
