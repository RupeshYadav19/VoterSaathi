<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | VoterSaathi</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .error-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-direction: column;
        }
        .error-code {
            font-size: 120px;
            font-family: var(--font-heading);
            color: var(--orange);
            font-weight: 800;
            line-height: 1;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="error-code">404</h1>
        <h2 style="margin-bottom: 24px;">Oops! We couldn't find that page.</h2>
        <p style="margin-bottom: 32px; max-width: 500px;" class="text-muted">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <a href="/" class="pill-btn">Return Home</a>
    </div>
</body>
</html>
